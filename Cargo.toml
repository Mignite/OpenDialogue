[workspace]
members = [
    "crates/*"
]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
[workspace.dependencies]
rod-core = { path = "crates/core" }
egui = "=0.33.0"
eframe = "=0.33.0"
wgpu = "=27.0.1"
rod-player = { path = "crates/player" }
rod-subs = { path = "crates/subs" }
