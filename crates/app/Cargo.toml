[package]
name = "rod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
rod-core.workspace = true
rod-player.workspace = true
rod-subs.workspace = true
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu"] }
wgpu = { workspace = true }
rfd = "0.15"
serde_json = "1"
# Codifica las miniaturas de recientes; también usado por `examples/preview.rs`.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "=0.33.0", features = ["eframe", "wgpu"] }
