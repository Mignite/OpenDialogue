[package]
name = "rod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
rod-core.workspace = true
rod-player.workspace = true
rod-subs.workspace = true
iced = { workspace = true, features = ["image-without-codecs"] }
rfd = "0.15"
serde_json = "1"

[dev-dependencies]
# `examples/preview.rs` guarda los PNG del preview para revisarlos a ojo.
image = { version = "0.25.10", default-features = false, features = ["png"] }
