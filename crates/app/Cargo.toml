[package]
name = "rod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
rod-core.workspace = true
rod-player.workspace = true
rod-subs.workspace = true
# `svg`: iconos del chrome dibujados con el widget de iced, sin assets externos.
iced = { workspace = true, features = ["image", "svg"] }
# Menú dibujado por la app: iced no trae barra de menú; muda sería nativo y
# exigiría unsafe para enganchar el HWND, además de no poder estilizarse.
iced_aw = { version = "0.14.1", features = ["menu", "quad"] }
rfd = "0.15"
serde_json = "1"
# Codifica las miniaturas de recientes; también usado por `examples/preview.rs`.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
