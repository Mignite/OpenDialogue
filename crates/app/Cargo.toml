[package]
name = "rod-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[features]
# Arnés de capturas (`examples/ui_audit.rs`): permite inyectar un frame fijo y
# fijar el reloj sin pedirle nada a mpv. No se activa en builds normales.
test-video = []

[[example]]
name = "ui_audit"
required-features = ["test-video"]

[dependencies]
rod-core.workspace = true
rod-player.workspace = true
rod-subs.workspace = true
egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu"] }
raw-window-handle = "0.6"
wgpu = { workspace = true }
rfd = "0.15"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Codifica las miniaturas de recientes; también usado por `examples/preview.rs`.
image = { version = "0.25.10", default-features = false, features = ["png"] }
egui-phosphor = "0.11"
fontdb = "0.24"

[dev-dependencies]
egui_kittest = { version = "=0.33.0", features = ["eframe", "wgpu"] }
ttf-parser = "0.25"
